<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Aplicación simple de Hola mundo para móvil" />

  <title>Hola Mundo Móvil</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --card: #111827;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-text: #082f49;
      --ok: #86efac;
      --error: #fda4af;
      --warning: #fde68a;
      --radius: 1.25rem;
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 1rem;
      padding-top: max(1rem, env(safe-area-inset-top));
      padding-right: max(1rem, env(safe-area-inset-right));
      padding-bottom: max(1rem, env(safe-area-inset-bottom));
      padding-left: max(1rem, env(safe-area-inset-left));
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      width: min(100%, 32rem);
      margin-inline: auto;
      display: grid;
      gap: 1rem;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
      background: var(--card);
      border-radius: var(--radius);
      padding: 1.25rem;
      box-shadow: 0 25px 80px rgb(0 0 0 / 0.35);
    }

    .title {
      margin: 0;
      font-size: clamp(1.8rem, 7vw, 2.6rem);
      line-height: 1.05;
    }

    .subtitle {
      margin: 0.35rem 0 0;
      color: var(--muted);
      line-height: 1.4;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 2rem;
      padding: 0.35rem 0.8rem;
      border-radius: 999px;
      background: rgb(56 189 248 / 0.12);
      color: var(--accent);
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .panel {
      background: var(--card);
      border-radius: var(--radius);
      padding: 1.25rem;
      box-shadow: 0 25px 80px rgb(0 0 0 / 0.35);
    }

    button {
      appearance: none;
      width: 100%;
      min-height: 3.25rem;
      border: 0;
      border-radius: 1rem;
      background: var(--accent);
      color: var(--accent-text);
      font: inherit;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 1rem 1.25rem;
      touch-action: manipulation;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    button:active {
      transform: scale(0.98);
      opacity: 0.92;
    }

    button:focus-visible {
      outline: 3px solid #7dd3fc;
      outline-offset: 3px;
    }

    .status {
      margin: 0.9rem 0 0;
      min-height: 1.5rem;
      color: var(--muted);
      line-height: 1.4;
    }

    .status.ok {
      color: var(--ok);
    }

    .status.error {
      color: var(--error);
    }

    .status.aviso {
      color: var(--warning);
    }

    .lista {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 0.8rem;
    }

    .item {
      background: var(--card);
      border: 1px solid rgb(255 255 255 / 0.06);
      border-radius: 1.1rem;
      padding: 1rem;
      box-shadow: 0 18px 50px rgb(0 0 0 / 0.25);
    }

    .item-titulo {
      margin: 0 0 0.35rem;
      font-size: 1.15rem;
    }

    .item-detalle {
      margin: 0 0 0.65rem;
      color: var(--muted);
      line-height: 1.45;
    }

    .item-meta {
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 600;
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <header class="topbar">
      <div>
        <h1 class="title" id="titulo-app">Hola mundo</h1>
        <p class="subtitle" id="subtitulo">Cargando datos...</p>
      </div>

      <span class="badge">Móvil</span>
    </header>

    <section class="panel" aria-label="Acciones">
      <button id="boton-recargar" type="button">
        Recargar lista
      </button>

      <p id="estado" class="status" role="status" aria-live="polite">
        Cargando...
      </p>
    </section>

    <section aria-label="Lista de datos">
      <ul id="lista" class="lista"></ul>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script src="utils.js"></script>
</body>
</html>
